name: Docker build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: Wedding
          file: Wedding/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
